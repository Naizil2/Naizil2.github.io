<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg2:#0b0b0b;--card:#111;--line:#262626;--fg:#fafafa;--mute:#8a8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);pointer-events:none;z-index:0}
section{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:110px 24px 40px}
.mono{font-family:'JetBrains Mono',monospace;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
/* nav */
.nav{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:2px;padding:5px;border-radius:999px;background:#0c0c0ccc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.nav a{position:relative;padding:8px 18px;border-radius:999px;color:var(--mute);text-decoration:none;font-size:.9rem;white-space:nowrap;transition:color .25s}
.nav a.on{color:#000}.nav a:hover{color:var(--fg)}.nav a.on:hover{color:#000}
.nav .pill{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--fg);transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1);z-index:0}
.nav a{z-index:1}
/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:140px}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;width:fit-content;font-size:.85rem;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
h1{font-size:clamp(2.8rem,9vw,7rem);line-height:.98;letter-spacing:-.04em;margin:24px 0 20px;font-weight:700}
h1 span{color:transparent;-webkit-text-stroke:1.5px var(--fg)}
.lead{max-width:560px;color:var(--mute);font-size:1.1rem}
.btns{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;border:1px solid var(--fg);background:var(--fg);color:#000;font:500 .95rem inherit;font-family:inherit;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}.btn.ghost:hover{border-color:var(--fg)}
.stats{display:flex;gap:40px;margin-top:64px;flex-wrap:wrap}
.stats b{display:block;font-size:2rem;letter-spacing:-.03em}
h2{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.03em;margin:8px 0 36px}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}.reveal.in{opacity:1;transform:none}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.about p{color:var(--mute);font-size:1.05rem;margin-top:0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:7px 16px;border:1px solid var(--line);border-radius:999px;font-size:.88rem;transition:.2s}
.tag:hover{background:var(--fg);color:#000}
/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{position:relative;border:1px solid var(--line);border-radius:28px;padding:28px;background:var(--card);overflow:hidden;transition:transform .3s,border-color .3s;min-height:250px;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(320px circle at var(--x,50%) var(--y,0),#ffffff17,transparent 60%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-6px);border-color:#555}.card:hover::before{opacity:1}
.card .n{font-size:3.2rem;font-weight:700;letter-spacing:-.05em;color:#2a2a2a;line-height:1}
.card h3{margin:auto 0 6px;font-size:1.4rem}
.card p{margin:0 0 16px;color:var(--mute);font-size:.95rem}
.card .tags .tag{font-size:.75rem;padding:4px 12px}
/* marquee */
.marq{overflow:hidden;border-block:1px solid var(--line);padding:22px 0;margin:60px 0 0;position:relative;z-index:1;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.marq div{display:flex;gap:48px;width:max-content;animation:m 28s linear infinite;font-size:2rem;font-weight:700;letter-spacing:-.03em;color:#3a3a3a;white-space:nowrap}
@keyframes m{to{transform:translateX(-50%)}}
/* contact */
.contact{text-align:center;padding-bottom:120px}
.contact a.big{display:inline-block;font-size:clamp(1.4rem,5vw,3rem);letter-spacing:-.03em;color:var(--fg);text-decoration:none;border-bottom:2px solid var(--fg);margin:10px 0 36px}
.socials{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;color:var(--mute);padding:0 0 100px;font-size:.85rem;position:relative;z-index:1}
/* chat */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:var(--fg);color:#000;border:0;font:600 .95rem 'Manrope',sans-serif;cursor:pointer;box-shadow:0 8px 40px #ffffff22;transition:transform .2s}
.fab:hover{transform:scale(1.05)}
.chat{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;width:min(380px,calc(100vw - 40px));height:min(540px,calc(100vh - 160px));display:flex;flex-direction:column;background:#0a0a0a;border:1px solid #333;border-radius:28px;overflow:hidden;box-shadow:0 20px 80px #000;transform-origin:bottom right;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}
.ch{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:var(--fg);color:#000;display:grid;place-items:center;font-weight:700}
.ch small{display:block;color:var(--mute);font-size:.75rem;line-height:1.2}
.ch button{margin-left:auto;background:none;border:0;color:var(--mute);font-size:1.4rem;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:84%;padding:10px 16px;border-radius:20px;font-size:.92rem;animation:pop .25s}
.m.bot{background:#1a1a1a;border-bottom-left-radius:6px;align-self:flex-start}
.m.me{background:var(--fg);color:#000;border-bottom-right-radius:6px;align-self:flex-end}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.chips button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.78rem;cursor:pointer}
.chips button:hover{background:var(--fg);color:#000}
.inp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.inp input{flex:1;min-width:0;background:#141414;border:1px solid var(--line);border-radius:999px;padding:11px 18px;color:var(--fg);font:inherit;font-size:.92rem;outline:none}
.inp input:focus{border-color:#666}
.inp button{width:42px;height:42px;border-radius:50%;border:0;background:var(--fg);color:#000;font-size:1.1rem;cursor:pointer}
/* v2: glass + vfx */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.aurora i:nth-child(1){width:48vw;height:48vw;left:-12vw;top:calc(-10vw + var(--sy,0)*.25px);background:radial-gradient(circle,#fff,#fff0 65%);opacity:.16;animation:float 16s ease-in-out infinite}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-10vw;top:calc(25vh - var(--sy,0)*.15px);background:radial-gradient(circle,#a5a5a5,#0000 65%);opacity:.28;animation:float 20s ease-in-out infinite reverse}
.aurora i:nth-child(3){width:36vw;height:36vw;left:28vw;top:calc(65vh - var(--sy,0)*.3px);background:radial-gradient(circle,#e0e0e0,#0000 65%);opacity:.13;animation:float 24s ease-in-out infinite}
@keyframes float{50%{transform:translate(50px,-60px) scale(1.18)}}
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.prog{position:fixed;top:0;left:0;height:3px;z-index:90;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,#333,#fff,#777);box-shadow:0 0 14px #fff8}
.spot{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,#ffffff22,#0000 65%);pointer-events:none;z-index:1;transform:translate(var(--mx,50vw),var(--my,30vh));transition:transform .15s ease-out}
@media(hover:none){.spot{display:none}}
.nav{background:linear-gradient(135deg,#ffffff2b,#ffffff0d);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid #ffffff33;box-shadow:inset 0 1px 0 #ffffff55,0 12px 40px #000b}
.nav .pill{background:linear-gradient(180deg,#fff,#c9c9c9);box-shadow:0 0 24px #ffffff66}
.card,.chat,.badge,.tag,.btn.ghost{background:linear-gradient(145deg,#ffffff1f,#ffffff06);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid #ffffff24;box-shadow:inset 0 1px 0 #ffffff33}
.card{box-shadow:inset 0 1px 0 #ffffff40,0 24px 60px #000a}
.card::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,#0000,#ffffff26,#0000);transform:skewX(-20deg);transition:left .9s;pointer-events:none}
.card:hover::after{left:140%}
.card .n{background:linear-gradient(180deg,#fff,#ffffff08);-webkit-background-clip:text;background-clip:text;color:transparent}
.gt{background:linear-gradient(100deg,#fff 15%,#6f6f6f 45%,#fff 75%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-220% center}}
.hero h1{transform:translateY(calc(var(--sy,0)*-.1px))}
.btn:not(.ghost){background:linear-gradient(180deg,#fff,#cfcfcf);box-shadow:0 0 30px #ffffff3a,inset 0 1px 0 #fff}
.btn.ghost:hover{background:#ffffff26}
.reveal{filter:blur(12px);transition:opacity .9s,transform .9s,filter .9s}.reveal.in{filter:none}
.marq{background:linear-gradient(90deg,#ffffff00,#ffffff0d,#ffffff00)}
.marq div{background:linear-gradient(90deg,#444,#fff 50%,#444);background-size:50% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.chat{background:linear-gradient(150deg,#ffffff24,#0a0a0ad9 55%);box-shadow:0 30px 90px #000,inset 0 1px 0 #ffffff40}
.m.bot{background:#ffffff14;border:1px solid #ffffff1f}
.inp input{background:#ffffff0f;border-color:#ffffff22}
.fab{background:linear-gradient(180deg,#fff,#c9c9c9);box-shadow:0 0 40px #ffffff44,inset 0 1px 0 #fff}
/* v3: fonts, typing, light theme */
body{transition:background-color .5s,color .5s}
h1,h2,h3,.stats b,.marq div,.card .n,.contact a.big,.ch>div:nth-child(2){font-family:'Syne',sans-serif}
h1{font-size:clamp(2.6rem,8.2vw,6.2rem);font-weight:800;letter-spacing:-.04em;min-height:1.96em}
h2{font-weight:700}
.caret{display:inline-block;width:.07em;height:.82em;margin-left:.06em;background:var(--fg);vertical-align:-.04em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(8px)}}
.hero .badge{animation:up .8s .1s both}.hero .lead{animation:up .9s 2s both}.hero .btns{animation:up .9s 2.3s both}.hero .stats{animation:up .9s 2.6s both}
.sw{position:relative;z-index:1;flex:none;width:58px;height:32px;margin:0 2px 0 6px;padding:0;border-radius:999px;border:1px solid #ffffff2e;background:#ffffff14;cursor:pointer}
.sw .k{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px;transition:transform .45s cubic-bezier(.3,1.5,.5,1),background .4s}
:root[data-theme=light]{--bg:#f3f3f1;--bg2:#fff;--card:#fff;--line:#d9d9d5;--fg:#0a0a0a;--mute:#6a6a6a;color-scheme:light}
[data-theme=light] .sw{border-color:#00000024;background:#0000000a}
[data-theme=light] .sw .k{transform:translateX(26px)}
[data-theme=light] body::before{background-image:radial-gradient(#00000020 1px,transparent 1px)}
[data-theme=light] .aurora i:nth-child(1){background:radial-gradient(circle,#000,#0000 65%);opacity:.08}
[data-theme=light] .aurora i:nth-child(2){background:radial-gradient(circle,#666,#0000 65%);opacity:.16}
[data-theme=light] .aurora i:nth-child(3){background:radial-gradient(circle,#000,#0000 65%);opacity:.06}
[data-theme=light] .spot{background:radial-gradient(circle,#00000016,#0000 65%)}
[data-theme=light] .grain{opacity:.045}
[data-theme=light] .prog{background:linear-gradient(90deg,#aaa,#000,#aaa);box-shadow:0 0 12px #0004}
[data-theme=light] .nav{background:linear-gradient(135deg,#ffffffd9,#ffffff80);border-color:#0000001f;box-shadow:inset 0 1px 0 #fff,0 12px 40px #0000002a}
[data-theme=light] .nav .pill{background:linear-gradient(180deg,#2b2b2b,#000);box-shadow:0 4px 20px #0005}
[data-theme=light] .nav a.on,[data-theme=light] .nav a.on:hover{color:#fff}
[data-theme=light] .card,[data-theme=light] .badge,[data-theme=light] .tag,[data-theme=light] .btn.ghost{background:linear-gradient(145deg,#ffffffcc,#ffffff59);border-color:#0000001a;box-shadow:inset 0 1px 0 #fff,0 10px 30px #00000010}
[data-theme=light] .card{box-shadow:inset 0 1px 0 #fff,0 24px 60px #0000001c}
[data-theme=light] .card:hover{border-color:#00000044}
[data-theme=light] .card::before{background:radial-gradient(320px circle at var(--x,50%) var(--y,0),#00000012,transparent 60%)}
[data-theme=light] .card::after{background:linear-gradient(100deg,#0000,#ffffffd9,#0000)}
[data-theme=light] .card .n{background:linear-gradient(180deg,#000,#00000010);-webkit-background-clip:text;background-clip:text}
[data-theme=light] .tag:hover,[data-theme=light] .chips button:hover{background:#000;color:#fff}
[data-theme=light] .gt{background:linear-gradient(100deg,#000 15%,#8d8d8d 45%,#000 75%);background-size:220% auto;-webkit-background-clip:text;background-clip:text}
[data-theme=light] .btn:not(.ghost){background:linear-gradient(180deg,#2b2b2b,#000);color:#fff;border-color:#000;box-shadow:0 8px 30px #0003}
[data-theme=light] .btn.ghost:hover{background:#0000000d}
[data-theme=light] .marq div{background:linear-gradient(90deg,#c4c4c4,#000 50%,#c4c4c4);background-size:50% 100%;-webkit-background-clip:text;background-clip:text}
[data-theme=light] .chat{background:linear-gradient(150deg,#fffffff2,#f1f1efe8 55%);border-color:#0000001f;box-shadow:0 30px 90px #0003,inset 0 1px 0 #fff}
[data-theme=light] .m.bot{background:#0000000a;border-color:#00000012}
[data-theme=light] .m.me,[data-theme=light] .av,[data-theme=light] .inp button{background:#000;color:#fff}
[data-theme=light] .inp input{background:#0000000a;border-color:#0000001a}
[data-theme=light] .fab{background:linear-gradient(180deg,#2b2b2b,#000);color:#fff;box-shadow:0 8px 40px #0004}
/* v4: switch, no hover glow, theme transition */
.spot{display:none}
.tag:hover{background:linear-gradient(145deg,#ffffff1f,#ffffff06);color:inherit;border-color:var(--fg)}
.chips button:hover{background:#ffffff1a;color:var(--fg)}
.btn.ghost:hover{background:transparent;border-color:var(--fg)}
[data-theme=light] .tag:hover{background:linear-gradient(145deg,#ffffffcc,#ffffff59);color:#0a0a0a;border-color:#000}
[data-theme=light] .chips button:hover{background:#0000000d;color:#000}
[data-theme=light] .btn.ghost:hover{background:transparent;border-color:#000}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.fade,.fade *,.fade *::before,.fade *::after{transition:background-color .7s,color .7s,border-color .7s,box-shadow .7s,fill .7s!important}
.tg{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:20px;z-index:55;width:78px;height:40px;padding:0;border-radius:999px;cursor:pointer;border:1px solid #ffffff33;background:linear-gradient(135deg,#ffffff2b,#ffffff0d);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 #ffffff55,0 10px 30px #0008;transition:transform .25s}
.tg:hover{transform:scale(1.05)}.tg:active{transform:scale(.95)}
.tg .kn{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#fff,#cfcfcf);box-shadow:0 2px 12px #0007;transition:transform .6s cubic-bezier(.34,1.5,.5,1),background .5s}
.tg .ic{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;transition:color .5s,transform .7s cubic-bezier(.34,1.5,.5,1)}
.tg .moon{left:10px;color:#000}.tg .sun{right:10px;color:var(--mute);transform:rotate(-90deg) scale(.85)}
[data-theme=light] .tg{border-color:#0000001f;background:linear-gradient(135deg,#ffffffd9,#ffffff80);box-shadow:inset 0 1px 0 #fff,0 10px 30px #0000002a}
[data-theme=light] .tg .kn{transform:translateX(38px);background:linear-gradient(180deg,#2b2b2b,#000)}
[data-theme=light] .tg .moon{color:var(--mute);transform:rotate(-50deg) scale(.85)}
[data-theme=light] .tg .sun{color:#fff;transform:none}
@media(max-width:720px){.tg{top:auto;right:auto;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
/* v5: targeted glass hover (buttons, tags, nav links, chips, switch, chat button) */
.btn,.tag,.chips button,.nav a,.tg,.fab{transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .35s,border-color .35s,box-shadow .4s,color .25s}
.btn.ghost:hover,.tag:hover,.chips button:hover{background-color:#ffffff22;border-color:#ffffff66;color:var(--fg);box-shadow:inset 0 1px 0 #ffffff70,inset 0 -10px 20px #ffffff0a,0 10px 30px #0008;backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);transform:translateY(-2px)}
.nav a:not(.on):hover{background-color:#ffffff1f;box-shadow:inset 0 1px 0 #ffffff50,0 4px 16px #0006;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn:not(.ghost):hover{box-shadow:0 12px 44px #ffffff55,inset 0 1px 0 #fff,inset 0 -8px 16px #00000014}
.fab:hover{box-shadow:0 12px 50px #ffffff55,inset 0 1px 0 #fff}
.tg:hover{box-shadow:inset 0 1px 0 #ffffff70,0 12px 36px #000a,0 0 0 1px #ffffff2a}
.inp button:hover{transform:scale(1.1)}.ch button:hover{color:var(--fg)}
[data-theme=light] .btn.ghost:hover,[data-theme=light] .tag:hover,[data-theme=light] .chips button:hover{background-color:#ffffffb3;border-color:#00000040;color:#0a0a0a;box-shadow:inset 0 1px 0 #fff,0 10px 30px #00000022;backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%)}
[data-theme=light] .nav a:not(.on):hover{background-color:#ffffffa6;box-shadow:inset 0 1px 0 #fff,0 4px 16px #0000001f}
[data-theme=light] .btn:not(.ghost):hover{box-shadow:0 12px 40px #0000004d,inset 0 1px 0 #ffffff55}
[data-theme=light] .fab:hover{box-shadow:0 12px 44px #0000005a,inset 0 1px 0 #ffffff55}
[data-theme=light] .tg:hover{box-shadow:inset 0 1px 0 #fff,0 12px 36px #0000003a,0 0 0 1px #00000014}
/* v6: card glass hover restored, faster intro */
.card:hover{backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border-color:#ffffff55}
[data-theme=light] .card:hover{border-color:#00000044}
.hero .lead{animation:up .8s 1.3s both}.hero .btns{animation:up .8s 1.5s both}.hero .stats{animation:up .8s 1.7s both}
/* v7: portrait */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.about{grid-template-columns:minmax(240px,380px) 1fr;column-gap:56px;row-gap:22px;align-items:start}
.about>.pf{grid-column:1;grid-row:1/3}
.about>p{grid-column:2;grid-row:1;margin:0}
.about>.tags{grid-column:2;grid-row:2;align-self:start}
.pf{margin:0;position:relative;aspect-ratio:4/5;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pf::before{content:"";position:absolute;inset:0;transform:translate(16px,16px);border:1px solid var(--line);border-radius:32px;z-index:-1;background:linear-gradient(145deg,#ffffff10,#ffffff00)}
.pf-ring{position:absolute;inset:-3px;border-radius:34px;padding:2px;background:conic-gradient(from var(--a),#fff,#1a1a1a 25%,#8a8a8a 50%,#1a1a1a 75%,#fff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 7s linear infinite}
[data-theme=light] .pf-ring{background:conic-gradient(from var(--a),#000,#d0d0d0 25%,#666 50%,#d0d0d0 75%,#000)}
.pf-frame{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:#0d0d0d;border:1px solid #ffffff22;box-shadow:0 30px 80px #000a}
.pf-frame img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15) brightness(.95);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.pf:hover .pf-frame img{transform:scale(1.07)}
.pf-fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0000 42%,#000000ea 100%),linear-gradient(135deg,#ffffff2e,#0000 38%)}
.pf-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#4a4a4a;background:radial-gradient(circle at 50% 28%,#3b3b3b,#0a0a0a 70%)}
.pf-up{color:#fff!important;font-size:.85rem;padding:9px 20px;position:relative;z-index:2}
.c{position:absolute;width:24px;height:24px;border:2px solid #fff;opacity:.85;pointer-events:none}
.c.tl{top:16px;left:16px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.c.tr{top:16px;right:16px;border-left:0;border-bottom:0;border-top-right-radius:12px}
.c.bl{bottom:92px;left:16px;border-right:0;border-top:0;border-bottom-left-radius:12px}
.c.br{bottom:92px;right:16px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.pf-cap{position:absolute;left:14px;right:14px;bottom:14px;padding:13px 18px;border-radius:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(145deg,#ffffff2b,#ffffff0d);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid #ffffff30;box-shadow:inset 0 1px 0 #ffffff45;color:#fff}
.pf-cap b{display:block;font-family:'Syne',sans-serif;font-size:1.02rem;line-height:1.2}
.pf-cap small{color:#cfcfcf;font-size:.8rem}
.pf-cap .dot{background:#fff;flex:none}
@media(max-width:720px){.about{grid-template-columns:1fr}.about>.pf,.about>p,.about>.tags{grid-column:1;grid-row:auto}.pf{max-width:340px;margin:0 auto 12px}}
@media(max-width:720px){.about{grid-template-columns:1fr}.nav a{padding:8px 13px;font-size:.82rem}.fab span.t{display:none}.fab{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useLayoutEffect } = React;

/* ====== EDIT YOUR DETAILS HERE ====== */
const ME = {
  name: "Your Name",
  role: "Full-stack developer & designer",
  city: "Bengaluru, India",
  photo: "", // data: URI of your portrait (attach your photo in chat and it gets embedded)
  email: "hello@yourname.com",
  bio: "I design and build fast, minimal, thoughtful web products. I care about clean interfaces, solid engineering and the small details that make software feel good.",
  skills: ["React","TypeScript","Node.js","Next.js","Python","PostgreSQL","Figma","Tailwind","AWS"],
  projects: [
    { t: "Orbit Dashboard", d: "Real-time analytics dashboard with live charts and team workspaces.", s: ["React","D3","WebSockets"] },
    { t: "Quill Notes", d: "A distraction-free, markdown-first notes app with offline sync.", s: ["Next.js","Postgres","PWA"] },
    { t: "Pixel Market", d: "Headless e-commerce storefront with blazing page speeds.", s: ["TypeScript","Stripe","Edge"] },
  ],
  stats: [["4+","Years experience"],["25","Projects shipped"],["12","Happy clients"]],
  links: [["GitHub","https://github.com/"],["LinkedIn","https://linkedin.com/"],["Twitter","https://twitter.com/"]],
};
const NAV = [["home","Home"],["about","About"],["work","Work"],["contact","Contact"]];

/* ====== Chatbot brain (rule-based, runs in the browser) ====== */
const has = (q, ...w) => w.some(x => q.includes(x));
function reply(q) {
  q = q.toLowerCase();
  if (has(q,"hi","hello","hey")) return `Hey! I’m ${ME.name.split(" ")[0]}’s assistant. Ask me about projects, skills or how to get in touch.`;
  if (has(q,"project","work","built","portfolio")) return "Recent work: " + ME.projects.map(p => p.t).join(", ") + ". Scroll to the Work section for details!";
  if (has(q,"skill","stack","tech","tools")) return "Main stack: " + ME.skills.join(", ") + ".";
  if (has(q,"hire","available","freelance","job")) return "Yes — open to freelance projects and full-time roles. Best way to start is an email.";
  if (has(q,"contact","email","reach","mail")) return `You can reach ${ME.name.split(" ")[0]} at ${ME.email}.`;
  if (has(q,"where","location","city","based")) return `Based in ${ME.city}, working with teams worldwide.`;
  if (has(q,"experience","years")) return `${ME.stats[0][0]} years of building products across web and design.`;
  if (has(q,"who","about","yourself")) return ME.bio;
  if (has(q,"thank")) return "Anytime! 🖤";
  return "I’m not sure about that one. Try asking about projects, skills, availability or contact.";
}

function Reveal({ children, className = "" }) {
  const ref = useRef();
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => e.isIntersecting && (ref.current.classList.add("in"), io.disconnect()), { threshold: .15 });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  return <div ref={ref} className={"reveal " + className}>{children}</div>;
}

function Nav({ theme, toggle }) {
  const [active, setActive] = useState("home");
  const [pill, setPill] = useState({ left: 5, width: 0 });
  const refs = useRef({});
  useEffect(() => {
    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActive(e.target.id)), { rootMargin: "-45% 0px -50% 0px" });
    NAV.forEach(([id]) => { const el = document.getElementById(id); el && io.observe(el); });
    return () => io.disconnect();
  }, []);
  useLayoutEffect(() => {
    const el = refs.current[active];
    if (el) setPill({ left: el.offsetLeft, width: el.offsetWidth });
  }, [active]);
  return (
    <nav className="nav">
      <span className="pill" style={pill} />
      {NAV.map(([id, label]) => (
        <a key={id} href={"#" + id} ref={el => refs.current[id] = el} className={active === id ? "on" : ""}>{label}</a>
      ))}
    </nav>
  );
}

function Typed({ text }) {
  const [n, setN] = useState(0);
  const armed = useRef(true), timer = useRef();
  useEffect(() => {
    const el = document.getElementById("home");
    const play = () => {
      clearTimeout(timer.current); let i = 0; setN(0);
      const step = 1350 / text.length;
      const go = () => { i++; setN(i); if (i < text.length) timer.current = setTimeout(go, step); };
      timer.current = setTimeout(go, 150);
    };
    const io = new IntersectionObserver(es => {
      const e = es[es.length - 1];
      if (!e.isIntersecting) { clearTimeout(timer.current); setN(0); armed.current = true; }
      else if (armed.current && e.intersectionRatio >= .35) { armed.current = false; play(); }
    }, { threshold: [0, .35] });
    io.observe(el);
    return () => { io.disconnect(); clearTimeout(timer.current); };
  }, [text]);
  const f = text.split(" ")[0], k = f.length;
  const a = text.slice(0, Math.min(n, k)), b = text.slice(k + 1, Math.max(k + 1, n));
  return <><b className="gt">{a}</b>{n <= k && <i className="caret" />}<br /><span>{b}</span>{n > k && <i className="caret" />}</>;
}

function Hero() {
  return (
    <section id="home" className="hero">
      <div className="badge"><i className="dot" /> Available for new projects</div>
      <h1 aria-label={ME.name}><Typed text={ME.name} /></h1>
      <p className="lead">{ME.role}. {ME.bio}</p>
      <div className="btns">
        <a className="btn" href="#work">View my work ↗</a>
        <a className="btn ghost" href="#contact">Let’s talk</a>
      </div>
      <div className="stats">{ME.stats.map(([n, l]) => <div key={l}><b>{n}</b><span className="mono">{l}</span></div>)}</div>
    </section>
  );
}

function Portrait() {
  const [src, setSrc] = useState(() => { try { return localStorage.getItem("ph") || ME.photo; } catch (e) { return ME.photo; } });
  const ref = useRef();
  const pick = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { setSrc(r.result); try { localStorage.setItem("ph", r.result); } catch (x) {} };
    r.readAsDataURL(f);
  };
  const tilt = e => {
    const b = ref.current.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5;
    ref.current.style.transform = "perspective(900px) rotateY(" + x * 9 + "deg) rotateX(" + (-y * 9) + "deg)";
  };
  return (
    <figure className="pf" ref={ref} onMouseMove={tilt} onMouseLeave={() => { ref.current.style.transform = ""; }}>
      <div className="pf-ring" />
      <div className="pf-frame">
        {src ? <img src={src} alt={ME.name} /> : (
          <div className="pf-ph">
            <svg viewBox="0 0 100 100" width="42%" fill="currentColor"><circle cx="50" cy="36" r="17" /><path d="M14 92c0-20 16-32 36-32s36 12 36 32z" /></svg>
            <label className="btn ghost pf-up">Add your photo<input type="file" accept="image/*" onChange={pick} hidden /></label>
          </div>
        )}
        <div className="pf-fade" />
        <i className="c tl" /><i className="c tr" /><i className="c bl" /><i className="c br" />
        <figcaption className="pf-cap">
          <div><b>{ME.name}</b><small>{ME.role}</small></div>
          <span className="dot" />
        </figcaption>
      </div>
    </figure>
  );
}

function About() {
  return (
    <section id="about">
      <Reveal>
        <div className="mono">( 01 ) About</div>
        <h2>Craft over noise.</h2>
        <div className="about"><Portrait />
          <p>{ME.bio} When I’m not coding, I’m exploring typography, tinkering with side projects and learning something new.</p>
          <div className="tags">{ME.skills.map(s => <span className="tag" key={s}>{s}</span>)}</div>
        </div>
      </Reveal>
    </section>
  );
}

function Work() {
  const move = e => { const r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty("--x", e.clientX - r.left + "px"); e.currentTarget.style.setProperty("--y", e.clientY - r.top + "px"); };
  return (
    <section id="work">
      <Reveal>
        <div className="mono">( 02 ) Selected work</div>
        <h2>Things I’ve built.</h2>
        <div className="grid">
          {ME.projects.map((p, i) => (
            <div className="card" key={p.t} onMouseMove={move}>
              <div className="n">0{i + 1}</div>
              <h3>{p.t}</h3><p>{p.d}</p>
              <div className="tags">{p.s.map(s => <span className="tag" key={s}>{s}</span>)}</div>
            </div>
          ))}
        </div>
      </Reveal>
    </section>
  );
}

function Contact() {
  return (
    <section id="contact" className="contact">
      <Reveal>
        <div className="mono">( 03 ) Contact</div>
        <h2>Have an idea?</h2>
        <a className="big" href={"mailto:" + ME.email}>{ME.email}</a>
        <div className="socials">{ME.links.map(([n, u]) => <a key={n} className="btn ghost" href={u} target="_blank" rel="noopener">{n} ↗</a>)}</div>
      </Reveal>
    </section>
  );
}

function Chat() {
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([{ who: "bot", t: `Hi! I’m the assistant for ${ME.name}’s portfolio. What would you like to know?` }]);
  const [val, setVal] = useState("");
  const [typing, setTyping] = useState(false);
  const end = useRef();
  useEffect(() => { end.current && end.current.scrollIntoView({ behavior: "smooth" }); }, [msgs, typing, open]);
  const send = text => {
    text = text.trim(); if (!text || typing) return;
    setMsgs(m => [...m, { who: "me", t: text }]); setVal(""); setTyping(true);
    setTimeout(() => { setMsgs(m => [...m, { who: "bot", t: reply(text) }]); setTyping(false); }, 700 + Math.random() * 500);
  };
  return (
    <>
      {open && (
        <div className="chat" role="dialog" aria-label="Chat assistant">
          <div className="ch"><div className="av">✦</div><div>Ask me anything<small>● online</small></div><button onClick={() => setOpen(false)} aria-label="Close">×</button></div>
          <div className="msgs">
            {msgs.map((m, i) => <div key={i} className={"m " + m.who}>{m.t}</div>)}
            {typing && <div className="m bot typing"><span /><span /><span /></div>}
            <div ref={end} />
          </div>
          <div className="chips">{["Projects", "Skills", "Hire you?", "Contact"].map(c => <button key={c} onClick={() => send(c)}>{c}</button>)}</div>
          <div className="inp">
            <input value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => e.key === "Enter" && send(val)} placeholder="Type a message…" />
            <button onClick={() => send(val)} aria-label="Send">↑</button>
          </div>
        </div>
      )}
      <button className="fab" onClick={() => setOpen(o => !o)}>✦ <span className="t">{open ? "Close" : "Chat with me"}</span></button>
    </>
  );
}

function App() {
  const items = [...ME.skills, ...ME.skills];
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem("th") || "dark"; } catch (e) { return "dark"; } });
  useEffect(() => { document.documentElement.dataset.theme = theme; try { localStorage.setItem("th", theme); } catch (e) {} }, [theme]);
  const toggle = e => {
    const next = theme === "dark" ? "light" : "dark", d = document.documentElement;
    const apply = () => { d.dataset.theme = next; ReactDOM.flushSync(() => setTheme(next)); };
    if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) {
      d.classList.add("fade"); apply(); setTimeout(() => d.classList.remove("fade"), 800); return;
    }
    const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(apply).ready.then(() => d.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
      { duration: 800, easing: "cubic-bezier(.4,0,.2,1)", pseudoElement: "::view-transition-new(root)" }
    )).catch(() => {});
  };
  useEffect(() => {
    const r = document.documentElement.style;
    const onS = () => { const y = window.scrollY, h = document.body.scrollHeight - innerHeight; r.setProperty("--sy", y); r.setProperty("--p", h > 0 ? y / h : 0); };
    const onM = e => { r.setProperty("--mx", e.clientX + "px"); r.setProperty("--my", e.clientY + "px"); };
    onS(); addEventListener("scroll", onS, { passive: true }); addEventListener("mousemove", onM);
    return () => { removeEventListener("scroll", onS); removeEventListener("mousemove", onM); };
  }, []);
  return (
    <>
      <div className="aurora"><i /><i /><i /></div><div className="grain" /><div className="prog" />
      <Nav theme={theme} toggle={toggle} />
      <button className="tg" onClick={toggle} role="switch" aria-checked={theme === "light"} aria-label="Toggle light and dark theme">
        <span className="kn" />
        <svg className="ic moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" /></svg>
        <svg className="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor" /><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /></svg>
      </button>
      <Hero /><About />
      <div className="marq"><div>{items.map((s, i) => <span key={i}>{s} ✦</span>)}</div></div>
      <Work /><Contact />
      <footer>© 2026 {ME.name}. Designed &amp; built with React.</footer>
      <Chat />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
